<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سِجِلّ — منصة تسجيل الأجانب | Sijil — Foreigner Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#faf9f7;--card:#ffffff;--border:#e7e3dc;--text:#20242a;--muted:#6b7280;
  --primary:hsl(184 62% 25%);--primary-fg:#ffffff;--primary-soft:hsl(184 45% 94%);
  --ok:#15803d;--ok-bg:#f0fdf4;--warn:#b45309;--warn-bg:#fffbeb;--bad:#b91c1c;--bad-bg:#fef2f2;
  --radius:10px;--shadow:0 1px 2px rgb(0 0 0 / .05);
}
.dark{
  --bg:#15181c;--card:#1d2126;--border:#31363d;--text:#e8eaed;--muted:#9aa2ad;
  --primary:hsl(184 38% 50%);--primary-fg:#0d1214;--primary-soft:hsl(184 30% 18%);
  --ok:#4ade80;--ok-bg:#12271a;--warn:#fbbf24;--warn-bg:#2a2213;--bad:#f87171;--bad-bg:#2b1717;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
[lang=ar] body,body:lang(ar){font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,Tahoma,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;border-inline-end:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--border)}
.brand svg{color:var(--primary);flex-shrink:0}
.brand .t1{font-weight:700;font-size:16px}
.brand .t2{font-size:11.5px;color:var(--muted)}
.navsec{padding:14px 10px;flex:1}
.navlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px;margin-bottom:2px}
.nav a svg{color:var(--muted);flex-shrink:0}
.nav a.active{background:var(--primary-soft);font-weight:600}
.nav a.active svg{color:var(--primary)}
.nav a:hover{background:var(--primary-soft)}
.nav .cnt{margin-inline-start:auto;background:var(--border);border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:600}
.sidefoot{padding:12px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5}
.topnote{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.iconbtn:hover{background:var(--primary-soft)}
.content{padding:26px 28px;max-width:1080px;width:100%;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
h2{font-size:15.5px;margin:0 0 12px;font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:40px;height:40px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .v{font-size:20px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pipe .step{display:flex;gap:10px}
.pipe .n{width:26px;height:26px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.pipe .h{font-weight:600;font-size:13.5px}
.pipe .d{font-size:12.5px;color:var(--muted)}
.alist{display:flex;flex-direction:column}
.aitem{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.aitem:last-child{border-bottom:0}
.aitem .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.aitem .when{margin-inline-start:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.btn{background:var(--primary);color:var(--primary-fg);border:1px solid var(--primary);border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn.outline:hover{background:var(--primary-soft);filter:none}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.ep{border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px}
.ep .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mtd{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;border:1px solid}
.mtd.get{color:#0a7a55;border-color:#0a7a5566;background:#0a7a5514}
.dark .mtd.get{color:#4ade9c}
.mtd.post{color:#a16207;border-color:#a1620766;background:#a1620714}
.dark .mtd.post{color:#fbbf24}
.scp{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 8px;color:var(--muted)}
.eppath{font-family:'IBM Plex Mono',monospace;font-size:12.5px;direction:ltr;unicode-bidi:embed}
.jsonout{direction:ltr;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;max-height:260px;overflow:auto;white-space:pre}
.ephead2{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ephead2 .ic{width:36px;height:36px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.steps{display:flex;align-items:center;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.steps .s .b{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--card)}
.steps .s.on{color:var(--text);font-weight:600}
.steps .s.on .b{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.steps .sep{width:26px;height:1px;background:var(--border)}
.drop{border:1.5px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;background:var(--card)}
.drop img{max-width:min(430px,100%);max-height:300px;border-radius:8px;border:1px solid var(--border)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:14px;color:var(--text);font-family:inherit;width:100%}
.field textarea{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:left;font-size:12.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.vlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.v{display:flex;gap:8px;align-items:center;font-size:13px;border-radius:7px;padding:6px 10px}
.v.ok{background:var(--ok-bg);color:var(--ok)}
.v.warn{background:var(--warn-bg);color:var(--warn)}
.v.fail{background:var(--bad-bg);color:var(--bad)}
.banner{border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;border:1px solid}
.banner.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.banner .bt{font-weight:700;font-size:15.5px;margin-bottom:3px}
.banner .bb{font-size:13.5px;color:var(--text)}
.mcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--card);margin-bottom:12px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-size:19px;font-weight:700;color:var(--primary)}
.bars{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 22px;margin-top:12px}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar .tr{height:5px;background:var(--border);border-radius:99px;margin-top:3px;overflow:hidden}
.bar .fi{height:100%;background:var(--primary);border-radius:99px}
.bar .fi.neg{background:var(--bad)}
.badge{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--bg);border-radius:999px;font-size:11.5px;padding:2px 10px;font-weight:500;white-space:nowrap}
.badge.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary);font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:start;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--primary-soft)}
.pname a{color:var(--primary);font-weight:600;text-decoration:none}
.pname .sec{font-size:12px;color:var(--muted)}
.search{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:14px;color:var(--text);font-family:inherit;margin-bottom:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px}
.kv .k{font-size:11.5px;color:var(--muted);font-weight:600}
.kv .val{font-size:14px;font-weight:500}
.doc{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:9px}
.doc .ic{width:34px;height:34px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.note{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:9px 12px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:9px;padding:10px 20px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
[dir=rtl] #toast{transform:translateX(50%)}
#toast.show{opacity:1}
.mt16{margin-top:16px}.mb16{margin-bottom:16px}.mut{color:var(--muted)}.fs12{font-size:12.5px}.fs13{font-size:13px}
@media(max-width:880px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-inline-end:0;border-bottom:1px solid var(--border)}
  .navsec{padding:8px 10px}
  .nav{display:flex;gap:4px;overflow-x:auto}
  .nav a{white-space:nowrap}
  .navlabel,.sidefoot{display:none}
  .grid4{grid-template-columns:1fr 1fr}
  .pipe{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .content{padding:18px 14px}
  .bars{grid-template-columns:1fr}
  .topbar{padding:10px 14px}
  .topnote{display:none}
}
</style>
</head>

  </main>
</div>

function jw(a,b){if(!a||!b)return 0;if(a===b)return 1;const w=Math.max(0,Math.floor(Math.max(a.length,b.length)/2)-1);const am=new Array(a.length).fill(false),bm=new Array(b.length).fill(false);let m=0;
for(let i=0;i<a.length;i++){const lo=Math.max(0,i-w),hi=Math.min(b.length-1,i+w);for(let j=lo;j<=hi;j++){if(!bm[j]&&a[i]===b[j]){am[i]=bm[j]=true;m++;break;}}}
if(!m)return 0;let t=0,k=0;for(let i=0;i<a.length;i++){if(am[i]){while(!bm[k])k++;if(a[i]!==b[k])t++;k++;}}
const j0=(m/a.length+m/b.length+(m-t/2)/m)/3;let p=0;for(let i=0;i<Math.min(4,a.length,b.length);i++){if(a[i]===b[i])p++;else break;}

function nameSim(a,b){if(!a||!b)return 0;const full=jw(a.replace(/\s+/g,""),b.replace(/\s+/g,""));const ta=a.split(" ").filter(Boolean),tb=b.split(" ").filter(Boolean);const used=new Set();let sum=0;
for(const t of ta){let best=0,bj=-1;tb.forEach((u,j)=>{if(used.has(j))return;const s=jw(t,u);if(s>best){best=s;bj=j;}});if(bj>=0)used.add(bj);sum+=best;}
return Math.max(full,sum/Math.max(ta.length,tb.length));}
/* MRZ ICAO 9303 */
function mrzVal(c){if(c>="0"&&c<="9")return c.charCodeAt(0)-48;if(c>="A"&&c<="Z")return c.charCodeAt(0)-55;return 0;}
function mrzCheck(f){let s=0;for(let i=0;i<f.length;i++)s+=mrzVal(f[i])*[7,3,1][i%3];return s%10;}
function yy2yyyy(yy,future){const n=Number(yy);const cur=new Date().getFullYear()%100;if(future)return (n>=0&&n<=cur+30)?2000+n:1900+n;return n<=cur?2000+n:1900+n;}
function parseMrz(text){
  const lines=(text||"").toUpperCase().replace(/[ \t]/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let l1=null,l2=null;
  for(const l of lines){if(/^P</.test(l))l1=l;else if(l.length>=28&&/^[A-Z0-9<]+$/.test(l))l2=l;}
  if(!l2)return null;
  const r={checks:[],fields:{}};
  const docRaw=l2.slice(0,9);r.fields.docNumber=docRaw.replace(/</g,"");
  r.checks.push({f:"fDocNumber",ok:mrzCheck(docRaw)===Number(l2[9])});
  r.fields.natCode=l2.slice(10,13).replace(/</g,"");
  const dobRaw=l2.slice(13,19);
  r.checks.push({f:"fDob",ok:mrzCheck(dobRaw)===Number(l2[19])});
  r.fields.dob=`${yy2yyyy(dobRaw.slice(0,2),false)}-${dobRaw.slice(2,4)}-${dobRaw.slice(4,6)}`;
  r.fields.gender=l2[20]==="F"?"female":"male";
  const expRaw=l2.slice(21,27);
  r.checks.push({f:"fExpiry",ok:mrzCheck(expRaw)===Number(l2[27])});
  r.fields.expiryDate=`${yy2yyyy(expRaw.slice(0,2),true)}-${expRaw.slice(2,4)}-${expRaw.slice(4,6)}`;
  if(l1){const nm=l1.slice(5).split("<<");const sur=(nm[0]||"").replace(/</g," ").trim();const giv=(nm[1]||"").replace(/</g," ").trim();r.fields.nameEn=(giv+" "+sur).trim();r.fields.issCode=l1.slice(2,5).replace(/</g,"");}

}

Extract exactly these fields, using ISO 8601 dates (YYYY-MM-DD):

const SIJIL_VERIFY_URL = "http://127.0.0.1:8787/api/verify-document";
function dataUrlToBlob(dataUrl){
  const parts=dataUrl.split(",");
  const mime=(parts[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
  const binary=atob(parts[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function camelKey(key){return String(key||"").replace(/_([a-z])/g,(_,c)=>c.toUpperCase());}
function normalizeBackendOcr(record){
  record=record||{};
  const fields={};
  Object.entries(record.fields||{}).forEach(([key,value])=>{
    const k=camelKey(key);
    fields[k]=value&&typeof value==="object"&&"value" in value
      ? value
      : {value:String(value??""),confidence:"medium"};
  });
  if(record.issuing_country&&!fields.issuingCountry)
    fields.issuingCountry={value:record.issuing_country,confidence:"medium"};
  const rawType=String(record.document_type||"").toLowerCase();
  let docType="other";
  if(rawType.includes("passport")||rawType.includes("جواز"))docType="passport";
  else if(rawType.includes("unhcr"))docType="unhcr_card";
  else if(rawType.includes("asylum")||rawType.includes("لجوء"))docType="asylum_document";
  return {...record,docType,photoBox:record.photo_box||null,fields};
}
async function runOcr(dataUrl,filename){
  window.dispatchEvent(new CustomEvent("sijil-verification-start"));
  try{
    const form=new FormData();
    form.append("image",dataUrlToBlob(dataUrl),filename||"document.jpg");
    const res=await fetch(SIJIL_VERIFY_URL,{method:"POST",body:form});
    const contentType=res.headers.get("content-type")||"";
    let payload={};
    if(contentType.includes("application/json")){
      payload=await res.json();
    }else{
      const text=await res.text();
      throw new Error(text.slice(0,240)||("Backend returned HTTP "+res.status+" without JSON."));
    }
    if(!res.ok||!payload.ok)throw new Error(payload.error||("HTTP "+res.status));
    window.__sijilVerificationResult=payload;
    window.dispatchEvent(new CustomEvent("sijil-verification-result",{detail:payload}));
    return normalizeBackendOcr(payload.ocr&&payload.ocr.record);
  }catch(error){
    window.dispatchEvent(new CustomEvent("sijil-verification-error",{detail:{message:String(error&&error.message||error)}}));
    throw error;
  }
}

  margin=margin||0.15;
  const dx=box.width*margin,dy=box.height*margin;
  const nx=Math.max(0,box.x-dx),ny=Math.max(0,box.y-dy);
  const nw=Math.min(1-nx,box.width+2*dx),nh=Math.min(1-ny,box.height+2*dy);
  return{x:nx,y:ny,width:nw,height:nh};
}
function cropPhoto(dataUrl,box){
  return new Promise((resolve,reject)=>{
    if(!box||!(box.width>0)||!(box.height>0)){reject(new Error("no photo box"));return;}
    box=padBox(box);
    const img=new Image();
    img.onload=()=>{
      const w=img.naturalWidth,h=img.naturalHeight;
      const sx=Math.max(0,box.x*w),sy=Math.max(0,box.y*h);
      const sw=Math.min(w-sx,box.width*w),sh=Math.min(h-sy,box.height*h);
      if(sw<=0||sh<=0){reject(new Error("invalid photo box"));return;}
      const c=document.createElement("canvas");c.width=sw;c.height=sh;
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror=()=>reject(new Error("image load failed"));
    img.src=dataUrl;
  });
}

/* ═══════════════ Engine: matching (port of server/matching.ts) ═══════════════ */
const AUTO=85, REVIEW=60, W={name:40,dob:25,gender:5,nationality:10,phone:12,motherName:8};
function dobScore(aDob,aPrec,bDob,bPrec){
  const [ay,am,ad]=aDob.split("-"),[by,bm,bd]=bDob.split("-");
  if(ay!==by){const diff=Math.abs(Number(ay)-Number(by));if(diff===1&&(aPrec==="year"||bPrec==="year"))return{score:W.dob*0.25,conflict:false};return{score:0,conflict:true};}
  if(aPrec!=="full"||bPrec!=="full")return{score:W.dob*0.5,conflict:false};
  if(am===bm&&ad===bd)return{score:W.dob,conflict:false};
  if(am===bm)return{score:W.dob*0.6,conflict:false};
  return{score:W.dob*0.35,conflict:false};
}
function scoreCandidate(input,person){
  const p=input.person,reasons=[];
  const arA=normalizeArabic(p.nameAr),enA=normalizeLatin(p.nameEn);
  const simAr=nameSim(arA,person.nameArNorm),simEn=nameSim(enA,person.nameEnNorm);
  const simCross=Math.max(nameSim(translitAr(p.nameAr),person.nameEnNorm),nameSim(enA,translitAr(person.nameAr)));
  const ns=Math.max(simAr,simEn,simCross*0.95),nameScore=ns*W.name;
  if(ns>=0.92)reasons.push("name_strong");else if(ns>=0.8)reasons.push("name_similar");
  const d=dobScore(p.dob,p.dobPrecision,person.dob,person.dobPrecision);
  if(d.score>=W.dob)reasons.push("dob_exact");if(d.conflict)reasons.push("dob_conflict");
  const g=p.gender===person.gender?W.gender:-15;if(g<0)reasons.push("gender_conflict");
  const nat=normalizeLatin(p.nationality)===normalizeLatin(person.nationality)?W.nationality:0;
  const pa=normPhone(p.phone),pb=normPhone(person.phone);const ph=pa&&pb&&pa===pb?W.phone:0;if(ph>0)reasons.push("phone_match");
  let mo=0;if(p.motherName&&person.motherName){const s=nameSim(normalizeArabic(p.motherName),normalizeArabic(person.motherName));mo=s>=0.85?W.motherName:s<=0.4?-8:s*W.motherName*0.5;if(s>=0.85)reasons.push("mother_name_match");}
  let ids=0;if(p.unhcrNumber&&person.unhcrNumber&&normDocNo(p.unhcrNumber)===normDocNo(person.unhcrNumber)){ids=20;reasons.push("unhcr_number_match");}
  const breakdown={name:Math.round(nameScore*10)/10,dob:Math.round(d.score*10)/10,gender:g,nationality:nat,phone:ph,motherName:Math.round(mo*10)/10,identifiers:ids};
  const raw=nameScore+d.score+g+nat+ph+mo+ids;
  return{personId:person.id,score:Math.max(0,Math.min(100,Math.round(raw*10)/10)),breakdown,reasons};
}
function evaluate(input){
  const docHit=DB.documents.find(d=>d.docType===input.document.docType&&d.docNumberNorm===normDocNo(input.document.docNumber)&&(d.issuingCountry||"").trim().toLowerCase()===(input.document.issuingCountry||"").trim().toLowerCase());
  if(docHit)return{decision:"rejected_duplicate",personId:docHit.personId,documentId:docHit.id,rule:"R1_EXACT_DOCUMENT",candidates:[]};
  const candidates=DB.persons.map(p=>scoreCandidate(input,p)).filter(c=>c.score>=35).sort((a,b)=>b.score-a.score).slice(0,5);
  if(input.person.unhcrNumber){const un=normDocNo(input.person.unhcrNumber);const hit=DB.persons.find(p=>p.unhcrNumber&&normDocNo(p.unhcrNumber)===un);
    if(hit){const c=candidates.find(x=>x.personId===hit.id);return{decision:"auto_match",personId:hit.id,score:c?c.score:100,rule:"R2_UNHCR_NUMBER",candidates};}}
  const top=candidates[0];
  if(top&&top.score>=AUTO)return{decision:"auto_match",personId:top.personId,score:top.score,rule:"R3_PROBABILISTIC",candidates};
  if(top&&top.score>=REVIEW)return{decision:"review",candidates};
  return{decision:"new",candidates};
}

    const bodyKey={rejected_duplicate:"evalRejectedBody",auto_match:"evalAutoBody",review:"evalReviewBody",new:"evalNewBody"}[ev.decision];
    const ruleKey=ev.rule==="R1_EXACT_DOCUMENT"?"ruleR1":ev.rule==="R2_UNHCR_NUMBER"?"ruleR2":ev.rule?"ruleR3":null;
    let existing="";

    </div>`;
    return `<h1>${T("regTitle")}</h1><p class="sub">${T("regSubtitle")}</p>${body}`;

    return `<h1>${T("regTitle")}</h1><p class="sub">${T("regSubtitle")}</p>${body}`;
  }

/* ═══════════════ Router & events ═══════════════ */
function route(){
  const h=location.hash||"#/dashboard";
  if(h.startsWith("#/person/"))return{page:"person",id:Number(h.split("/")[2])};
  if(h.startsWith("#/document/"))return{page:"document",id:Number(h.split("/")[2])};
  if(h.startsWith("#/register"))return{page:"register"};
  if(h.startsWith("#/persons"))return{page:"persons"};
  if(h.startsWith("#/reviews"))return{page:"reviews"};
  if(h.startsWith("#/integrations"))return{page:"integrations"};
  return{page:"dashboard"};
}
function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  const r=route();
  const nav=[["dashboard","navDashboard",ICONS.dash,"#/dashboard"],["register","navRegister",ICONS.reg,"#/register"],["persons","navPersons",ICONS.ppl,"#/persons"],["reviews","navReviews",ICONS.rev,"#/reviews"],["integrations","navIntegrations",ICONS.plug,"#/integrations"]];
  const pend=DB.reviews.filter(x=>x.status==="pending").length;
  document.getElementById("nav").innerHTML=nav.map(([id,k,ic,href])=>`<a href="${href}" class="${r.page===id||((r.page==="person"||r.page==="document")&&id==="persons")?"active":""}">${ic}<span>${T(k)}</span>${id==="reviews"&&pend?`<span class="cnt">${pend}</span>`:""}</a>`).join("");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T(el.dataset.t));
  document.getElementById("btn-lang").textContent=T("langToggle");
  const dark=document.documentElement.classList.contains("dark");
  document.getElementById("btn-theme").innerHTML=dark?ICONS.sun:ICONS.moon;
  document.getElementById("btn-reset").innerHTML=ICONS.reset+`<span>${T("resetData")}</span>`;
  const view=document.getElementById("view");
  view.innerHTML=r.page==="dashboard"?vDashboard():r.page==="register"?vRegister():r.page==="persons"?vPersons():r.page==="person"?vPerson(r.id):r.page==="document"?vDocument(r.id):r.page==="integrations"?vIntegrations():vReviews();
  bindView(r);
}

      }).catch(err=>{wiz.ocrLoading=false;wiz.ocrError=String(err&&err.message||err);render();});
    };rd.readAsDataURL(f);});
    on("btn-ocr-continue",()=>{const fields=wiz.ocr.fields||{};for(const k of OCR_FIELD_KEYS){if(fields[k])wiz.form[k]=fields[k].value;}if(wiz.ocr.docType)wiz.form.docType=wiz.ocr.docType;wiz.step=2;render();});
    on("btn-parse-mrz",()=>{const txt=document.getElementById("mrz-input").value;wiz.mrzText=txt;const m=parseMrz(txt);wiz.mrzError=!m;wiz.mrz=m;
      if(m){const f=m.fields;Object.assign(wiz.form,{nameEn:f.nameEn||wiz.form.nameEn,dob:f.dob||wiz.form.dob,gender:f.gender||wiz.form.gender,docNumber:f.docNumber||wiz.form.docNumber,expiryDate:f.expiryDate||wiz.form.expiryDate,docType:"passport"});}
      render();});
    on("btn-skip",()=>{wiz.step=2;render();});
    on("btn-continue",()=>{wiz.step=2;render();});
    on("btn-back1",()=>{wiz.step=1;render();});
    on("btn-run-check",()=>{collectForm();const f=wiz.form;
      if(!f.nameAr||!f.nameEn||!f.dob||!f.nationality||!f.docNumber||!f.issuingCountry){toast(T("requiredFields"));return;}
      wiz.evalResult=evaluate(inputFromWiz());wiz.step=3;render();window.scrollTo(0,0);});
    on("btn-back2",()=>{wiz.step=2;render();});
    on("btn-confirm",()=>{
      const ev=wiz.evalResult,input=inputFromWiz();
      if(ev.decision==="auto_match"){const doc=addDocument(ev.personId,input.document);audit("doc_linked","aud_linked",personById(ev.personId).upi);wiz.final={kind:"linked",personId:ev.personId};}
      else if(ev.decision==="new"){const p=createPerson(input.person);addDocument(p.id,input.document);audit("registered","aud_registered",p.upi);wiz.final={kind:"created",personId:p.id};}
      else if(ev.decision==="review"){DB.reviews.push({id:++DB.seq.review,payload:input,candidates:ev.candidates,status:"pending",createdAt:new Date().toISOString()});audit("review_created","aud_review_created");wiz.final={kind:"review"};}
      saveDB();wiz.step=4;render();window.scrollTo(0,0);});
    on("btn-startnew",()=>{resetWiz();render();});
  }
  if(r.page==="persons"){
    const s=document.getElementById("search");
    if(s){s.addEventListener("input",e=>{window.__searchQ=e.target.value;const scroll=window.scrollY;render();const s2=document.getElementById("search");s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);window.scrollTo(0,scroll);});}
    document.querySelectorAll("tr[data-pid]").forEach(tr=>tr.addEventListener("click",e=>{if(e.target.tagName!=="A")location.hash="#/person/"+tr.dataset.pid;}));
  }
  if(r.page==="person"){
    on("btn-delete-person",()=>{const btn=document.getElementById("btn-delete-person");const pid=Number(btn.dataset.pid);
      if(!confirm(T("deletePersonConfirm")))return;
      deletePerson(pid);toast(T("personDeleted"));location.hash="#/persons";render();});
    document.querySelectorAll(".doc[data-docid]").forEach(el=>el.addEventListener("click",()=>{location.hash="#/document/"+el.dataset.docid;}));
  }
  if(r.page==="integrations"){
    document.querySelectorAll("[data-sim]").forEach(b=>b.addEventListener("click",()=>{
      const k=b.dataset.sim;const res=INT_SIM[k]();
      const out=document.getElementById("out-"+k);
      out.innerHTML=`<div class="mut" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:10px">${T("intResponse")}</div><pre class="jsonout">${esc(JSON.stringify(res,null,2))}</pre>`;
    }));
  }
  if(r.page==="reviews"){
    document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
      const rid=Number(b.dataset.rid),act=b.dataset.act;
      const rc=DB.reviews.find(x=>x.id===rid);if(!rc||rc.status!=="pending")return;
      if(act==="link"){const pid=Number(b.dataset.pid);addDocument(pid,rc.payload.document);rc.status="linked";rc.resolvedPersonId=pid;audit("review_linked","aud_review_linked",personById(pid).upi);}
      else if(act==="new"){const p=createPerson(rc.payload.person);addDocument(p.id,rc.payload.document);rc.status="new_person";rc.resolvedPersonId=p.id;audit("review_new","aud_review_new",p.upi);}
      else{rc.status="rejected";audit("review_rejected","aud_review_rejected");}
      rc.resolvedAt=new Date().toISOString();saveDB();toast(T("resolveDone"));render();
    }));
  }
}
/* Global toggles */
document.getElementById("btn-lang").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";render();});
document.getElementById("btn-theme").addEventListener("click",()=>{document.documentElement.classList.toggle("dark");render();});
document.getElementById("btn-reset").addEventListener("click",()=>{if(confirm(T("resetConfirm"))){if(HAS_LS)localStorage.removeItem(LS_KEY);seed();resetWiz();toast(T("resetDone"));render();}});
window.addEventListener("hashchange",()=>{if(route().page!=="register"&&wiz&&wiz.step===4)resetWiz();render();});
if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("dark");
loadDB();resetWiz();render();
</script>
  <script src="./sijil_template_integration.js"></script>
